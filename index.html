<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Management System</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
            crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <!-- Header -->
        <div class="header text-white py-4">
            <div class="container">
                <h1>Student Management System</h1>
                <p class="mb-0">Add, update, search and remove student records.</p>
            </div>
        </div>

        <div class="container cards pb-5">
            <div class="row g-4">

                <!-- Form -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 p-4">
                        <h5 id="formTitle" class="mb-3">New student</h5>

                        <label for="studentName">Full name</label>
                        <input type="text" name="studentName" id="studentName"
                            class="form-control mb-1" placeholder="e.g. Sara Ahmed">
                        <div class="alert alert-danger py-1 d-none" id="alert" role="alert">
                            Start with a capital letter, 3 to 30 letters
                        </div>

                        <label for="studentDepartment" class="mt-2">Department</label>
                        <input type="text" name="studentDepartment" id="studentDepartment"
                            class="form-control" placeholder="e.g. Computer Science">

                        <label for="studentGrade" class="mt-2">Grade (0-100)</label>
                        <input type="number" name="studentGrade" id="studentGrade"
                            class="form-control" placeholder="e.g. 85">

                        <label for="studentNotes" class="mt-2">Notes</label>
                        <textarea name="studentNotes" id="studentNotes"
                            class="form-control" rows="3" placeholder="Optional"></textarea>

                        <p class="text-danger d-none mt-2 mb-0" id="allFields">please Fill All Fields</p>

                        <div class="d-flex gap-2 mt-3">
                            <button class="btn btn-brand flex-grow-1" id="add"
                                onclick="addStudent()">Add student</button>
                            <button class="btn btn-outline-secondary" id="clr"
                                onclick="clearStudent()">Clear</button>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Students <span class="badge text-bg-secondary" id="count">0</span></h5>
                            <input type="search" name="search" id="search"
                                class="form-control w-50" placeholder="Search by name">
                        </div>

                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <th>#</th>
                                    <th>Name</th>
                                    <th>Department</th>
                                    <th>Grade</th>
                                    <th>Notes</th>
                                    <th>Update</th>
                                    <th>Delete</th>
                                </thead>
                                <tbody id="tbody">

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
            crossorigin="anonymous"></script>

        <script src="script.js"></script>
    </body>
</html>
